<div class="page-header">
  <h1>Feed</h1>
  <p class="text-muted">What's happening in the enclave.</p>
</div>

<!-- Compose box -->
<div class="compose-box">
  <div class="compose-top">
    <div class="compose-avatar" data-slot="compose-avatar"></div>
    <select class="compose-circle" id="composeCircle" aria-label="Post to circle"></select>
  </div>
  <textarea class="compose-body" id="composeBody" placeholder="Share an insight, ask for input, or offer your expertise..." rows="3"></textarea>
  <div class="compose-prompts" role="group" aria-label="Conversation starters">
    <span class="compose-prompts-label">Start with a prompt</span>
    <div class="compose-prompt-list">
      <button type="button" class="compose-prompt" data-compose-prompt="Question for the group: ">Ask for input</button>
      <button type="button" class="compose-prompt" data-compose-prompt="An insight worth sharing: ">Share an insight</button>
      <button type="button" class="compose-prompt" data-compose-prompt="I can help with: ">Offer help</button>
      <button type="button" class="compose-prompt" data-compose-prompt="Looking for a collaborator on: ">Find a collaborator</button>
    </div>
  </div>
  <div id="photoAttachmentPreview" class="photo-preview" hidden></div>
  <div id="driveAttachmentPreview" class="drive-preview" hidden></div>
  <div class="compose-status-row">
    <span class="compose-draft-status" id="composeDraftStatus" aria-live="polite"></span>
    <span class="compose-shortcut"><kbd>Ctrl/⌘</kbd> + <kbd>Enter</kbd> to post</span>
  </div>
  <div class="compose-actions">
    <button type="button" class="btn btn-ghost" id="htmlImportBtn">&#60;/&#62; HTML</button>
    <button type="button" class="btn btn-ghost" id="photoAttachBtn">&#128247; Photos</button>
    <button type="button" class="btn btn-ghost" id="driveAttachBtn">&#128193; Attach from Drive</button>
    <button class="btn btn-primary" id="composeSubmit">Post</button>
  </div>
  <input type="file" id="htmlFileInput" accept=".html,.htm,text/html" hidden />
  <input type="file" id="photoFileInput" accept="image/*" multiple hidden />
</div>

<!-- Circle filter pills -->
<div class="filter-pills"></div>

<!-- Feed list -->
<div class="feed-list" id="feedList">
  <div class="skeleton-card" aria-hidden="true">
    <div class="skeleton-row">
      <div class="skeleton skeleton-avatar"></div>
      <div class="skeleton-stack">
        <div class="skeleton skeleton-line" style="width:42%"></div>
        <div class="skeleton skeleton-line" style="width:22%"></div>
      </div>
    </div>
    <div class="skeleton skeleton-line" style="width:100%"></div>
    <div class="skeleton skeleton-line" style="width:86%"></div>
    <div class="skeleton skeleton-line" style="width:62%"></div>
  </div>
  <div class="skeleton-card" aria-hidden="true">
    <div class="skeleton-row">
      <div class="skeleton skeleton-avatar"></div>
      <div class="skeleton-stack">
        <div class="skeleton skeleton-line" style="width:35%"></div>
        <div class="skeleton skeleton-line" style="width:18%"></div>
      </div>
    </div>
    <div class="skeleton skeleton-line" style="width:100%"></div>
    <div class="skeleton skeleton-line" style="width:75%"></div>
  </div>
  <div class="skeleton-card" aria-hidden="true">
    <div class="skeleton-row">
      <div class="skeleton skeleton-avatar"></div>
      <div class="skeleton-stack">
        <div class="skeleton skeleton-line" style="width:50%"></div>
        <div class="skeleton skeleton-line" style="width:25%"></div>
      </div>
    </div>
    <div class="skeleton skeleton-line" style="width:100%"></div>
    <div class="skeleton skeleton-line" style="width:90%"></div>
    <div class="skeleton skeleton-line" style="width:55%"></div>
  </div>
</div>
